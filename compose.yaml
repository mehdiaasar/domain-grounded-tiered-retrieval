# docker compose up  ->  http://localhost:8501
services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      # Optional. Without them the app starts in replay mode.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
    env_file:
      - path: .env
        required: false
