name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests app.py
      - name: Tests
        # No API keys: the suite drives the real graph with a scripted model.
        run: pytest -q
      - name: App imports cleanly
        run: python -c "import ast,sys; ast.parse(open('app.py').read())"
